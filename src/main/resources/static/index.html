<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI Agent Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
            onerror="this.onerror=null;this.src='https://unpkg.com/marked@12.0.2/marked.min.js'"></script>
    <style>
        :root {
            color-scheme: light;
            --paper: #f5f1e8;
            --paper-2: #fbf8f1;
            --ink: #1d2620;
            --ink-soft: #4d574f;
            --muted: #7d877e;
            --line: #dfd9cb;
            --line-strong: #cec6b4;
            --pine: #16362a;
            --pine-2: #1f4a39;
            --mint: #e3efe7;
            --mint-2: #cfe3d7;
            --amber: #b4761f;
            --amber-soft: #f6ead2;
            --danger: #a33b2e;
            --danger-soft: #f8e3de;
            --shadow: 0 18px 50px rgba(30, 42, 34, 0.08);
            --radius: 18px;
            --mono: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", Georgia, serif;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: var(--sans);
            color: var(--ink);
            background:
                radial-gradient(1200px 600px at 85% -10%, rgba(31, 74, 57, 0.10), transparent 60%),
                radial-gradient(900px 500px at 10% 110%, rgba(180, 118, 31, 0.08), transparent 55%),
                var(--paper);
            -webkit-font-smoothing: antialiased;
        }

        button, textarea { font: inherit; }

        .app {
            display: grid;
            grid-template-columns: 286px minmax(0, 1fr);
            height: 100%;
        }

        /* ---------------- Sidebar ---------------- */

        .sidebar {
            background: var(--pine);
            color: #eef4ef;
            padding: 26px 22px 20px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            overflow-y: auto;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #e9d9ae, #c9a75c);
            color: #1d2a21;
            font-size: 20px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .brand h1 {
            font-family: var(--serif);
            font-size: 19px;
            letter-spacing: 0.02em;
            margin: 0;
            font-weight: 600;
        }

        .brand p {
            margin: 2px 0 0;
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(238, 244, 239, 0.55);
        }

        .new-chat {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 11px 14px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.07);
            color: #f3f7f4;
            cursor: pointer;
            transition: background 0.18s ease, transform 0.18s ease;
        }

        .new-chat:hover { background: rgba(255, 255, 255, 0.13); }
        .new-chat:active { transform: translateY(1px); }

        .panel h2 {
            margin: 0 0 10px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(238, 244, 239, 0.5);
        }

        .kv {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            padding: 5px 0;
            font-size: 12.5px;
            color: rgba(238, 244, 239, 0.72);
        }

        .kv code {
            font-family: var(--mono);
            font-size: 11.5px;
            color: #f0e3bd;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tool-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .tool-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 12.5px;
        }

        .tool-list code {
            font-family: var(--mono);
            font-size: 10px;
            color: rgba(238, 244, 239, 0.48);
        }

        .kb-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            color: rgba(238, 244, 239, 0.78);
            line-height: 1.5;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex: none;
            background: #8c968d;
        }

        .dot.ok { background: #61c08d; box-shadow: 0 0 0 3px rgba(97, 192, 141, 0.16); }
        .dot.off { background: #d08b3c; box-shadow: 0 0 0 3px rgba(208, 139, 60, 0.16); }

        .kb-sources {
            margin-top: 8px;
            font-size: 11.5px;
            line-height: 1.6;
            color: rgba(238, 244, 239, 0.45);
            word-break: break-all;
        }

        .checkpoint-note {
            margin-bottom: 8px;
            font-size: 10.5px;
            color: rgba(238, 244, 239, 0.4);
        }

        .checkpoint-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .checkpoint-list li.empty {
            padding: 8px 10px;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.04);
            font-size: 11.5px;
            color: rgba(238, 244, 239, 0.4);
        }

        .checkpoint-list li.item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 7px 7px 10px;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.05);
        }

        .checkpoint-list code {
            font-family: var(--mono);
            font-size: 11px;
            color: #ead9a8;
        }

        .checkpoint-list button {
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: transparent;
            color: rgba(238, 244, 239, 0.75);
            border-radius: 7px;
            padding: 3px 8px;
            font-size: 10.5px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .checkpoint-list button:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .checkpoint-list button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .sidebar footer {
            margin-top: auto;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 10.5px;
            line-height: 1.7;
            color: rgba(238, 244, 239, 0.38);
        }

        /* ---------------- Main ---------------- */

        .main {
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100%;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 18px 30px;
            border-bottom: 1px solid var(--line);
            background: rgba(251, 248, 241, 0.72);
            backdrop-filter: blur(10px);
        }

        .topbar-title {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .topbar-title h2 {
            margin: 0;
            font-family: var(--serif);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.01em;
            white-space: nowrap;
        }

        .topbar-title span {
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--paper-2);
            font-size: 11px;
            color: var(--ink-soft);
            white-space: nowrap;
        }

        .mobile-brand { display: none; }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px 30px 12px;
            scroll-behavior: smooth;
        }

        .thread {
            width: min(820px, 100%);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 26px;
        }

        .turn {
            display: flex;
            gap: 12px;
            animation: rise 0.28s ease both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            flex: none;
            display: grid;
            place-items: center;
            font-size: 13px;
            margin-top: 2px;
            background: var(--pine);
            color: #f0e3bd;
        }

        .turn.user { justify-content: flex-end; }

        .turn.user .bubble {
            max-width: min(560px, 82%);
            padding: 12px 16px;
            border-radius: 16px 16px 4px 16px;
            background: var(--pine-2);
            color: #f2f7f3;
            font-size: 14.5px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: 0 8px 22px rgba(22, 54, 42, 0.16);
        }

        .turn.assistant .content {
            min-width: 0;
            flex: 1;
            padding-top: 3px;
        }

        .assistant-name {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 7px;
            letter-spacing: 0.02em;
        }

        .thinking {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
            padding: 7px 0;
        }

        .thinking::before {
            content: "";
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: 2px solid var(--line-strong);
            border-top-color: var(--pine-2);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .markdown {
            font-size: 15px;
            line-height: 1.78;
            word-break: break-word;
        }

        .markdown > :first-child { margin-top: 0; }
        .markdown > :last-child { margin-bottom: 0; }

        .markdown p { margin: 0 0 12px; }
        .markdown h1, .markdown h2, .markdown h3, .markdown h4 {
            font-family: var(--serif);
            line-height: 1.35;
            margin: 22px 0 10px;
        }
        .markdown h1 { font-size: 22px; }
        .markdown h2 { font-size: 19px; }
        .markdown h3 { font-size: 17px; }
        .markdown ul, .markdown ol { margin: 0 0 12px; padding-left: 22px; }
        .markdown li { margin: 4px 0; }
        .markdown a { color: var(--pine-2); text-underline-offset: 3px; }
        .markdown blockquote {
            margin: 12px 0;
            padding: 8px 14px;
            border-left: 3px solid var(--mint-2);
            background: rgba(227, 239, 231, 0.55);
            color: var(--ink-soft);
            border-radius: 0 8px 8px 0;
        }
        .markdown code {
            font-family: var(--mono);
            font-size: 0.86em;
            background: #ece7da;
            padding: 2px 5px;
            border-radius: 5px;
        }
        .markdown pre {
            background: #1b2a22;
            color: #e7eee8;
            padding: 14px 16px;
            border-radius: 12px;
            overflow-x: auto;
            margin: 12px 0;
            font-size: 12.5px;
            line-height: 1.6;
        }
        .markdown pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
        .markdown table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13.5px; }
        .markdown th, .markdown td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; }
        .markdown th { background: var(--paper-2); }
        .markdown hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }

        .cursor {
            display: inline-block;
            width: 7px;
            height: 16px;
            margin-left: 2px;
            vertical-align: -2px;
            background: var(--pine-2);
            border-radius: 1px;
            animation: blink 1s steps(2, start) infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* ---------------- Tool cards ---------------- */

        .tool-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0 0 14px;
        }

        .tool-card {
            border: 1px solid var(--line);
            border-radius: 12px;
            background: rgba(251, 248, 241, 0.9);
            overflow: hidden;
        }

        .tool-head {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 9px 12px;
            font-size: 12.5px;
        }

        .tool-state {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            flex: none;
            border: 2px solid var(--line-strong);
            border-top-color: var(--pine-2);
            animation: spin 0.8s linear infinite;
        }

        .tool-state.done {
            animation: none;
            border: none;
            background: var(--mint-2);
            position: relative;
        }

        .tool-state.done::after {
            content: "✓";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 10px;
            color: var(--pine);
        }

        .tool-state.failed {
            animation: none;
            border: none;
            background: var(--danger-soft);
            position: relative;
        }

        .tool-state.failed::after {
            content: "!";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 10px;
            font-weight: 700;
            color: var(--danger);
        }

        .tool-label { font-weight: 600; color: var(--ink); }

        .tool-name {
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--muted);
            background: #efeade;
            padding: 2px 6px;
            border-radius: 5px;
        }

        .tool-io {
            border-top: 1px solid var(--line);
            padding: 8px 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tool-io:empty { display: none; }

        .tool-io .io-label {
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .tool-io pre {
            margin: 0;
            font-family: var(--mono);
            font-size: 11.5px;
            line-height: 1.55;
            color: var(--ink-soft);
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* ---------------- Sources & errors ---------------- */

        .sources {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
        }

        .sources:empty { display: none; }

        .sources-label {
            font-size: 10.5px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-right: 2px;
        }

        .source-chip {
            border: 1px solid var(--line);
            background: var(--amber-soft);
            color: #6d4a15;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 11.5px;
            cursor: pointer;
            transition: border-color 0.15s ease;
        }

        .source-chip:hover { border-color: #d9b881; }

        .source-detail {
            flex-basis: 100%;
            margin-top: 4px;
            padding: 9px 11px;
            border-radius: 9px;
            background: rgba(246, 234, 210, 0.55);
            border: 1px dashed #dcc596;
            font-size: 12px;
            line-height: 1.6;
            color: #6b551f;
        }

        .error-box {
            border: 1px solid #e0b8af;
            background: var(--danger-soft);
            color: var(--danger);
            border-radius: 12px;
            padding: 11px 14px;
            font-size: 13px;
            line-height: 1.65;
            margin-top: 4px;
        }

        .checkpoint-line {
            margin-top: 10px;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.02em;
        }

        .checkpoint-line:empty { display: none; }

        .resume-note {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            padding: 4px 9px;
            border-radius: 999px;
            background: var(--mint);
            border: 1px solid var(--mint-2);
            color: #2f5c45;
            font-size: 10.5px;
        }

        /* ---------------- Approval dialog ---------------- */

        .approval-mask {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(22, 38, 30, 0.42);
            backdrop-filter: blur(3px);
        }

        .approval-mask[hidden] { display: none; }

        .approval-dialog {
            width: min(560px, 100%);
            max-height: min(80vh, 720px);
            overflow: auto;
            padding: 22px 22px 18px;
            background: var(--paper-2);
            border: 1px solid var(--line-strong);
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(20, 32, 25, 0.28);
            animation: rise 0.22s ease both;
        }

        .approval-dialog h3 {
            margin: 0 0 6px;
            font-family: var(--serif);
            font-size: 20px;
            font-weight: 600;
        }

        .approval-sub {
            margin: 0 0 16px;
            color: var(--ink-soft);
            font-size: 13px;
            line-height: 1.6;
        }

        .approval-calls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .approval-call {
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.55);
        }

        .approval-call-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        .approval-call-head strong { font-size: 13px; }

        .approval-call-head code {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
        }

        .approval-call pre {
            margin: 0;
            padding: 8px 10px;
            border-radius: 8px;
            background: var(--paper);
            color: var(--ink-soft);
            font-family: var(--mono);
            font-size: 11.5px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .approval-remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 14px 0 2px;
            color: var(--ink-soft);
            font-size: 12.5px;
            cursor: pointer;
        }

        .approval-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }

        .approval-actions button {
            padding: 9px 16px;
            border: 1px solid var(--line-strong);
            border-radius: 10px;
            background: var(--paper-2);
            color: var(--ink);
            font-size: 13px;
            cursor: pointer;
        }

        .approval-actions button:hover { border-color: var(--pine-2); }

        .approval-actions .approval-allow {
            background: var(--pine);
            border-color: var(--pine);
            color: #f2f7f3;
        }

        .approval-actions .approval-allow:hover { background: var(--pine-2); }

        .approval-hint {
            min-height: 14px;
            margin-top: 10px;
            font-size: 11px;
            color: var(--muted);
        }

        .approval-wait {
            color: var(--muted);
            font-size: 13px;
        }

        /* ---------------- Empty state ---------------- */

        .empty {
            width: min(720px, 100%);
            margin: 8vh auto 0;
            text-align: center;
            animation: rise 0.4s ease both;
        }

        .empty .seal {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #f0e2bd, #cfa95c);
            color: #223026;
            font-size: 26px;
            box-shadow: var(--shadow);
        }

        .empty h1 {
            font-family: var(--serif);
            font-size: clamp(26px, 3.4vw, 34px);
            font-weight: 600;
            margin: 0 0 10px;
            letter-spacing: 0.01em;
        }

        .empty p {
            margin: 0 auto;
            max-width: 520px;
            color: var(--ink-soft);
            font-size: 14px;
            line-height: 1.7;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin: 28px 0 0;
        }

        .suggestion {
            text-align: left;
            padding: 13px 15px;
            border: 1px solid var(--line);
            border-radius: 13px;
            background: rgba(251, 248, 241, 0.85);
            color: var(--ink-soft);
            font-size: 13px;
            line-height: 1.5;
            cursor: pointer;
            transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
        }

        .suggestion:hover {
            transform: translateY(-1px);
            border-color: var(--line-strong);
            background: var(--paper-2);
        }

        .suggestion span {
            display: block;
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 4px;
        }

        /* ---------------- Composer ---------------- */

        .composer-wrap {
            padding: 10px 30px 22px;
        }

        .composer {
            width: min(820px, 100%);
            margin: 0 auto;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            background: var(--paper-2);
            box-shadow: var(--shadow);
            padding: 12px 12px 9px 16px;
            transition: border-color 0.18s ease;
        }

        .composer:focus-within { border-color: var(--pine-2); }

        .composer-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        .composer textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            color: var(--ink);
            font-size: 14.5px;
            line-height: 1.65;
            max-height: 168px;
            padding: 5px 0;
        }

        .composer textarea::placeholder { color: #9aa197; }

        .send {
            flex: none;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 11px;
            background: var(--pine);
            color: #f4efe2;
            font-size: 17px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background 0.16s ease, transform 0.16s ease;
        }

        .send:hover { background: var(--pine-2); }
        .send:active { transform: translateY(1px); }
        .send:disabled { background: #b9c1b9; cursor: not-allowed; }

        .composer-meta {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 5px 2px 0;
            font-size: 10.5px;
            color: var(--muted);
        }

        /* ---------------- Responsive ---------------- */

        @media (max-width: 900px) {
            .app { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .mobile-brand {
                display: flex;
                align-items: center;
                gap: 9px;
                font-family: var(--serif);
                font-size: 15px;
                white-space: nowrap;
            }
            .mobile-brand .brand-mark { width: 30px; height: 30px; border-radius: 9px; font-size: 14px; }
            .topbar { padding: 12px 16px; }
            .topbar-title span { display: none; }
            .messages { padding: 22px 16px 8px; }
            .composer-wrap { padding: 8px 16px 16px; }
            .suggestions { grid-template-columns: 1fr; }
            .empty { margin-top: 4vh; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">✦</div>
            <div>
                <h1>Spring AI</h1>
                <p>Agent Demo</p>
            </div>
        </div>

        <button class="new-chat" id="newChat" type="button">＋ 新对话</button>

        <section class="panel">
            <h2>会话</h2>
            <div class="kv"><span>会话 ID</span><code id="cidLabel">—</code></div>
            <div class="kv"><span>模型</span><code id="modelLabel">加载中…</code></div>
        </section>

        <section class="panel">
            <h2>可用工具</h2>
            <ul class="tool-list" id="toolList">
                <li><span>加载中…</span></li>
            </ul>
        </section>

        <section class="panel">
            <h2>知识库</h2>
            <div class="kb-status" id="kbStatus">
                <span class="dot"></span><span>检查中…</span>
            </div>
            <div class="kb-sources" id="kbSources"></div>
        </section>

        <section class="panel">
            <h2>检查点</h2>
            <div class="checkpoint-note">MemorySaver · 重启后清空</div>
            <ul class="checkpoint-list" id="checkpointList">
                <li class="empty">执行过程中生成</li>
            </ul>
        </section>

        <footer>
            Spring Boot 3.5 · Spring AI 1.1<br>
            工具调用 · 会话记忆 · 向量检索 · 检查点
        </footer>
    </aside>

    <main class="main">
        <header class="topbar">
            <div class="topbar-title">
                <div class="mobile-brand">
                    <div class="brand-mark">✦</div>
                    <span>Spring AI Agent</span>
                </div>
                <h2>智能体工作台</h2>
                <span id="threadHint">新会话</span>
            </div>
            <div class="badge"><span class="dot ok"></span>SSE 流式输出</div>
        </header>

        <div class="messages" id="messages">
            <div class="thread" id="thread"></div>
        </div>

        <div class="composer-wrap">
            <form class="composer" id="composer">
                <div class="composer-row">
                    <textarea id="input" rows="1"
                              placeholder="试试：帮我算一下 (128*3+56)/4，再查一下杭州天气"></textarea>
                    <button class="send" id="send" type="submit" title="发送">↑</button>
                </div>
                <div class="composer-meta">
                    <span>Enter 发送 · Shift + Enter 换行</span>
                    <span id="busyHint"></span>
                </div>
            </form>
        </div>
    </main>
</div>

<div class="approval-mask" id="approvalMask" hidden>
    <div class="approval-dialog" role="dialog" aria-modal="true" aria-labelledby="approvalTitle">
        <h3 id="approvalTitle">需要你的确认</h3>
        <p class="approval-sub">以下工具调用会访问数据或产生副作用，允许后才会执行。</p>
        <div class="approval-calls" id="approvalCalls"></div>
        <label class="approval-remember">
            <input type="checkbox" id="approvalRemember">
            <span>本次会话内不再询问这些工具</span>
        </label>
        <div class="approval-actions">
            <button type="button" id="approvalDeny">拒绝</button>
            <button type="button" class="approval-allow" id="approvalAllow">允许执行</button>
        </div>
        <div class="approval-hint" id="approvalHint"></div>
    </div>
</div>

<script>
(() => {
    'use strict';

    const els = {
        thread: document.getElementById('thread'),
        messages: document.getElementById('messages'),
        input: document.getElementById('input'),
        composer: document.getElementById('composer'),
        send: document.getElementById('send'),
        newChat: document.getElementById('newChat'),
        cidLabel: document.getElementById('cidLabel'),
        modelLabel: document.getElementById('modelLabel'),
        toolList: document.getElementById('toolList'),
        kbStatus: document.getElementById('kbStatus'),
        kbSources: document.getElementById('kbSources'),
        checkpointList: document.getElementById('checkpointList'),
        threadHint: document.getElementById('threadHint'),
        busyHint: document.getElementById('busyHint'),
        approvalMask: document.getElementById('approvalMask'),
        approvalCalls: document.getElementById('approvalCalls'),
        approvalRemember: document.getElementById('approvalRemember'),
        approvalAllow: document.getElementById('approvalAllow'),
        approvalDeny: document.getElementById('approvalDeny'),
        approvalHint: document.getElementById('approvalHint')
    };

    const state = {
        conversationId: makeId(),
        busy: false,
        meta: null,
        metaAttempts: 0
    };

    let pendingApproval = null;
    let runToken = 0;

    function makeId() {
        return 'c-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    }

    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function renderMarkdown(text) {
        let html = '';
        if (window.marked) {
            try {
                html = marked.parse(text, {breaks: true, gfm: true, async: false});
            } catch (err) {
                html = '';
            }
        }
        if (!html) {
            html = escapeHtml(text).replace(/\n/g, '<br>');
        }
        return html.replace(/<script[\s\S]*?<\/script>/gi, '');
    }

    function scrollToBottom() {
        els.messages.scrollTop = els.messages.scrollHeight;
    }

    function updateConversationLabel() {
        els.cidLabel.textContent = state.conversationId;
        els.cidLabel.title = state.conversationId;
        els.threadHint.textContent = state.conversationId === 'default'
            ? '默认会话'
            : '会话 ' + state.conversationId.slice(0, 10);
    }

    function showEmptyState() {
        els.thread.innerHTML = `
            <div class="empty">
                <div class="seal">✦</div>
                <h1>今天想让 Agent 做点什么？</h1>
                <p>它会自己判断何时查时间、算数、看天气、记待办，也会先翻一遍知识库再回答。
                   所有工具调用过程都会实时显示在回答上方；Graph 每经过 agent / tools 节点都会保存检查点。</p>
                <div class="suggestions">
                    <button class="suggestion" type="button" data-prompt="现在几点？今天星期几？">
                        <span>工具 · 时间</span>现在几点？今天星期几？
                    </button>
                    <button class="suggestion" type="button" data-prompt="帮我算一下 (128*3+56)/4 等于多少">
                        <span>工具 · 计算</span>帮我算一下 (128*3+56)/4
                    </button>
                    <button class="suggestion" type="button" data-prompt="杭州今天天气怎么样？适合出门吗？">
                        <span>工具 · 天气</span>杭州今天天气怎么样？
                    </button>
                    <button class="suggestion" type="button" data-prompt="出差住宿标准是多少？报销需要哪些材料？">
                        <span>RAG · 知识库</span>出差住宿标准是多少？
                    </button>
                    <button class="suggestion" type="button" data-prompt="把「周五下午提交周报」加入待办，然后列出全部待办">
                        <span>工具 · 待办</span>把「周五下午提交周报」加入待办
                    </button>
                    <button class="suggestion" type="button" data-prompt="去杭州出差两天，帮我列一份行程建议，并查一下天气">
                        <span>组合 · 多工具</span>去杭州出差两天，列一份行程建议
                    </button>
                </div>
            </div>`;
        els.thread.querySelectorAll('.suggestion').forEach(button => {
            button.addEventListener('click', () => sendMessage(button.dataset.prompt || ''));
        });
    }

    function addUserTurn(text) {
        const turn = document.createElement('div');
        turn.className = 'turn user';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        turn.appendChild(bubble);
        els.thread.appendChild(turn);
        scrollToBottom();
    }

    function addAssistantTurn() {
        const turn = document.createElement('div');
        turn.className = 'turn assistant';
        turn.innerHTML = `
            <div class="avatar">✦</div>
            <div class="content">
                <div class="assistant-name">Spring AI 小助手</div>
                <div class="tool-stack"></div>
                <div class="thinking">正在思考…</div>
                <div class="markdown"></div>
                <div class="sources"></div>
                <div class="checkpoint-line"></div>
            </div>`;
        els.thread.appendChild(turn);
        scrollToBottom();
        return {
            turn: turn,
            toolStack: turn.querySelector('.tool-stack'),
            thinking: turn.querySelector('.thinking'),
            textEl: turn.querySelector('.markdown'),
            sourcesEl: turn.querySelector('.sources'),
            checkpointEl: turn.querySelector('.checkpoint-line'),
            raw: '',
            frame: null,
            toolCards: new Map()
        };
    }

    function scheduleRender(ui) {
        if (ui.frame) {
            return;
        }
        ui.frame = requestAnimationFrame(() => {
            ui.frame = null;
            ui.textEl.innerHTML = renderMarkdown(ui.raw) + '<span class="cursor"></span>';
            scrollToBottom();
        });
    }

    function removeThinking(ui) {
        if (ui.thinking) {
            ui.thinking.remove();
            ui.thinking = null;
        }
    }

    function addToolIo(card, label, value) {
        let body = card.querySelector('.tool-io');
        if (!body) {
            body = document.createElement('div');
            body.className = 'tool-io';
            card.appendChild(body);
        }
        const labelEl = document.createElement('div');
        labelEl.className = 'io-label';
        labelEl.textContent = label;
        const pre = document.createElement('pre');
        pre.textContent = value;
        body.appendChild(labelEl);
        body.appendChild(pre);
    }

    function handleToolEvent(event, ui) {
        removeThinking(ui);
        let card = ui.toolCards.get(event.id);
        if (!card) {
            card = document.createElement('div');
            card.className = 'tool-card';
            card.innerHTML = `
                <div class="tool-head">
                    <span class="tool-state"></span>
                    <span class="tool-label"></span>
                    <code class="tool-name"></code>
                </div>`;
            card.querySelector('.tool-label').textContent = event.label || event.name;
            card.querySelector('.tool-name').textContent = event.name;
            ui.toolStack.appendChild(card);
            ui.toolCards.set(event.id, card);
        }

        if (event.phase === 'start') {
            if (event.input && event.input !== '{}') {
                addToolIo(card, '入参', event.input);
            }
        } else {
            const stateEl = card.querySelector('.tool-state');
            stateEl.className = 'tool-state ' + (event.phase === 'end' ? 'done' : 'failed');
            if (event.output) {
                addToolIo(card, event.phase === 'end' ? '结果' : '错误', event.output);
            }
        }
        scrollToBottom();
    }

    function renderSources(ui, sources) {
        ui.sourcesEl.innerHTML = '';
        if (!sources || sources.length === 0) {
            return;
        }
        const label = document.createElement('span');
        label.className = 'sources-label';
        label.textContent = '参考资料';
        ui.sourcesEl.appendChild(label);

        sources.forEach(source => {
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'source-chip';
            chip.textContent = '[' + source.index + '] ' + source.source;
            chip.title = source.snippet || '';
            chip.addEventListener('click', () => {
                let detail = ui.sourcesEl.querySelector('.source-detail');
                if (!detail) {
                    detail = document.createElement('div');
                    detail.className = 'source-detail';
                    ui.sourcesEl.appendChild(detail);
                }
                detail.textContent = '[' + source.index + '] ' + source.source + ' — ' +
                    (source.snippet || '暂无摘要');
            });
            ui.sourcesEl.appendChild(chip);
        });
    }

    function showError(ui, message) {
        removeThinking(ui);
        ui.errorMessage = message;
        const box = document.createElement('div');
        box.className = 'error-box';
        box.textContent = message;
        ui.textEl.appendChild(box);
        scrollToBottom();
    }

    function showApproval(approval, ui) {
        removeThinking(ui);
        if (ui && ui.textEl && !ui.raw) {
            ui.textEl.innerHTML = '<span class="approval-wait">已暂停，等待你确认工具调用。</span>';
        }

        pendingApproval = {approval: approval, ui: ui};
        els.approvalCalls.innerHTML = '';
        (approval.calls || []).forEach(call => {
            const item = document.createElement('div');
            item.className = 'approval-call';

            const head = document.createElement('div');
            head.className = 'approval-call-head';
            const label = document.createElement('strong');
            label.textContent = call.label || call.name;
            const code = document.createElement('code');
            code.textContent = call.name;
            head.appendChild(label);
            head.appendChild(code);

            const pre = document.createElement('pre');
            pre.textContent = call.input || '{}';

            item.appendChild(head);
            item.appendChild(pre);
            els.approvalCalls.appendChild(item);
        });

        els.approvalRemember.checked = false;
        els.approvalHint.textContent = approval.expiresAt
            ? '确认请求有效期至 ' + new Date(approval.expiresAt).toLocaleTimeString()
            : '';
        els.approvalMask.hidden = false;
        els.approvalAllow.focus();
        setBusy(state.busy);
        scrollToBottom();
    }

    function resolveApproval(approved) {
        if (!pendingApproval) {
            return;
        }
        const approval = pendingApproval.approval;
        const remember = els.approvalRemember.checked;
        pendingApproval = null;
        els.approvalMask.hidden = true;

        const ui = addAssistantTurn();
        ui.turn.querySelector('.assistant-name').textContent = approved
            ? '已授权 · 继续执行'
            : '已拒绝 · 让模型调整';
        runApprovalStream(approval, approved, remember, ui);
    }

    async function runApprovalStream(approval, approved, remember, ui) {
        const token = ++runToken;
        setBusy(true);
        try {
            const response = await fetch('/api/approvals/' + encodeURIComponent(approval.approvalId), {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'text/event-stream'
                },
                body: JSON.stringify({approved: approved, rememberSession: remember})
            });

            if (!response.ok || !response.body) {
                const detail = await response.text().catch(() => '');
                throw new Error('HTTP ' + response.status + (detail ? '：' + detail : ''));
            }

            await consumeSse(response, (eventName, payload) => handleEvent(eventName, payload, ui));
        } catch (error) {
            showError(ui, '继续执行失败：' + (error && error.message ? error.message : error));
        } finally {
            finalizeUi(ui);
            if (token === runToken) {
                setBusy(false);
                els.input.focus();
            }
            loadCheckpoints();
            scrollToBottom();
        }
    }

    function finalizeUi(ui) {
        removeThinking(ui);
        if (ui.frame) {
            cancelAnimationFrame(ui.frame);
            ui.frame = null;
        }
        if (ui.raw) {
            ui.textEl.innerHTML = renderMarkdown(ui.raw);
            if (ui.errorMessage) {
                const box = document.createElement('div');
                box.className = 'error-box';
                box.textContent = ui.errorMessage;
                ui.textEl.appendChild(box);
            }
        }
    }

    function shortId(id) {
        return String(id || '').slice(0, 8);
    }

    function renderCheckpoints(ids) {
        els.checkpointList.innerHTML = '';
        if (!ids || ids.length === 0) {
            const li = document.createElement('li');
            li.className = 'empty';
            li.textContent = '执行过程中生成';
            els.checkpointList.appendChild(li);
            return;
        }

        ids.slice(0, 8).forEach(id => {
            const li = document.createElement('li');
            li.className = 'item';

            const code = document.createElement('code');
            code.textContent = '#' + shortId(id);
            code.title = id;

            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = '回放';
            button.title = '从这个检查点继续执行';
            button.addEventListener('click', () => resumeCheckpoint(id));

            li.appendChild(code);
            li.appendChild(button);
            els.checkpointList.appendChild(li);
        });
    }

    async function loadCheckpoints() {
        try {
            const response = await fetch('/api/checkpoints?conversationId=' +
                encodeURIComponent(state.conversationId));
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            const data = await response.json();
            renderCheckpoints((data.checkpoints || []).map(item => item.checkpointId));
        } catch (error) {
            renderCheckpoints([]);
        }
    }

    async function resumeCheckpoint(checkpointId) {
        if (state.busy) {
            return;
        }

        const empty = els.thread.querySelector('.empty');
        if (empty) {
            empty.remove();
        }

        setBusy(true);
        const ui = addAssistantTurn();
        removeThinking(ui);
        ui.turn.querySelector('.assistant-name').textContent = '从检查点回放';

        const note = document.createElement('div');
        note.className = 'resume-note';
        note.textContent = '继续执行 #' + shortId(checkpointId);
        ui.turn.querySelector('.content').insertBefore(note, ui.toolStack);

        try {
            const response = await fetch('/api/checkpoints/' + encodeURIComponent(checkpointId) +
                '/resume?conversationId=' + encodeURIComponent(state.conversationId), {method: 'POST'});
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(data.error || ('HTTP ' + response.status));
            }

            ui.checkpointEl.textContent = '回放自检查点 #' + shortId(checkpointId);
            if (data.approval) {
                showApproval(data.approval, ui);
            } else {
                ui.raw = data.reply || '';
                ui.textEl.innerHTML = renderMarkdown(ui.raw || '（该检查点之后没有新的输出）');
                renderSources(ui, data.sources || []);
            }
            await loadCheckpoints();
        } catch (error) {
            showError(ui, '回放失败：' + (error && error.message ? error.message : error));
        } finally {
            setBusy(false);
            els.input.focus();
            scrollToBottom();
        }
    }

    function handleEvent(eventName, payload, ui) {
        let data;
        try {
            data = JSON.parse(payload);
        } catch (err) {
            return;
        }

        if (eventName === 'delta') {
            removeThinking(ui);
            ui.raw += data.text || '';
            scheduleRender(ui);
        } else if (eventName === 'tool') {
            handleToolEvent(data, ui);
        } else if (eventName === 'sources') {
            renderSources(ui, data.sources);
        } else if (eventName === 'checkpoint') {
            if (ui.checkpointEl) {
                ui.checkpointEl.textContent = '检查点已保存 · #' + shortId(data.checkpointId);
            }
            loadCheckpoints();
        } else if (eventName === 'approval') {
            showApproval(data, ui);
        } else if (eventName === 'error') {
            showError(ui, data.message || '未知错误');
        } else if (eventName === 'meta') {
            updateConversationLabel();
        }
    }

    async function consumeSse(response, onEvent) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        const dispatch = block => {
            let eventName = 'message';
            const dataLines = [];
            block.split('\n').forEach(line => {
                if (line.startsWith('event:')) {
                    eventName = line.slice(6).trim();
                } else if (line.startsWith('data:')) {
                    dataLines.push(line.slice(5).replace(/^ /, ''));
                }
            });
            if (dataLines.length > 0) {
                onEvent(eventName, dataLines.join('\n'));
            }
        };

        while (true) {
            const {value, done} = await reader.read();
            if (done) {
                break;
            }
            buffer += decoder.decode(value, {stream: true});
            let boundary;
            while ((boundary = buffer.indexOf('\n\n')) !== -1) {
                dispatch(buffer.slice(0, boundary));
                buffer = buffer.slice(boundary + 2);
            }
        }
        buffer += decoder.decode();
        if (buffer.trim()) {
            dispatch(buffer);
        }
    }

    function setBusy(busy) {
        state.busy = busy;
        const locked = busy || !!pendingApproval;
        els.send.disabled = locked;
        els.busyHint.textContent = busy ? '正在生成…' : (pendingApproval ? '等待确认…' : '');
        els.input.disabled = locked;
        els.checkpointList.querySelectorAll('button').forEach(button => {
            button.disabled = locked;
        });
    }

    async function sendMessage(text) {
        const message = (text || '').trim();
        if (!message || state.busy || pendingApproval) {
            return;
        }

        const empty = els.thread.querySelector('.empty');
        if (empty) {
            empty.remove();
        }

        setBusy(true);
        addUserTurn(message);
        els.input.value = '';
        autoresize();

        const token = ++runToken;
        const ui = addAssistantTurn();

        try {
            const response = await fetch('/api/chat/stream', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'text/event-stream'
                },
                body: JSON.stringify({
                    conversationId: state.conversationId,
                    message: message
                })
            });

            if (!response.ok || !response.body) {
                const detail = await response.text().catch(() => '');
                throw new Error('HTTP ' + response.status + (detail ? '：' + detail : ''));
            }

            await consumeSse(response, (eventName, payload) => handleEvent(eventName, payload, ui));
        } catch (error) {
            showError(ui, '请求失败：' + (error && error.message ? error.message : error));
        } finally {
            finalizeUi(ui);
            if (token === runToken) {
                setBusy(false);
                els.input.focus();
            }
            loadCheckpoints();
            scrollToBottom();
        }
    }

    function autoresize() {
        els.input.style.height = 'auto';
        els.input.style.height = Math.min(els.input.scrollHeight, 168) + 'px';
    }

    async function loadMeta() {
        try {
            const response = await fetch('/api/meta');
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            const meta = await response.json();
            state.meta = meta;

            els.modelLabel.textContent = meta.model || 'unknown';
            els.modelLabel.title = meta.model || '';

            els.kbStatus.innerHTML = meta.ragReady
                ? '<span class="dot ok"></span><span>已就绪 · ' + (meta.knowledgeChunks || 0) + ' 个片段</span>'
                : '<span class="dot off"></span><span>未启用（检查 Embedding 配置）</span>';
            els.kbSources.textContent = (meta.knowledgeSources && meta.knowledgeSources.length)
                ? meta.knowledgeSources.join(' · ')
                : '没有加载到文档';

            if (Array.isArray(meta.tools)) {
                els.toolList.innerHTML = '';
                meta.tools.forEach(tool => {
                    const li = document.createElement('li');
                    const name = document.createElement('span');
                    name.textContent = tool.label || tool.name;
                    const code = document.createElement('code');
                    code.textContent = tool.name;
                    li.appendChild(name);
                    li.appendChild(code);
                    els.toolList.appendChild(li);
                });
            }

            // 知识库在 ApplicationReadyEvent 里异步准备，启动瞬间可能还没就绪，稍后重试几次
            if (!meta.ragReady && state.metaAttempts < 3) {
                state.metaAttempts += 1;
                setTimeout(loadMeta, 3000);
            }
        } catch (error) {
            els.modelLabel.textContent = '读取失败';
            els.kbStatus.innerHTML = '<span class="dot off"></span><span>无法读取服务信息</span>';
        }
    }

    els.composer.addEventListener('submit', event => {
        event.preventDefault();
        sendMessage(els.input.value);
    });

    els.approvalAllow.addEventListener('click', () => resolveApproval(true));
    els.approvalDeny.addEventListener('click', () => resolveApproval(false));

    els.input.addEventListener('input', autoresize);
    els.input.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
            event.preventDefault();
            sendMessage(els.input.value);
        }
    });

    els.newChat.addEventListener('click', () => {
        if (state.busy || pendingApproval) {
            return;
        }
        state.conversationId = makeId();
        updateConversationLabel();
        showEmptyState();
        renderCheckpoints([]);
        els.input.focus();
    });

    updateConversationLabel();
    showEmptyState();
    loadMeta();
    loadCheckpoints();
    els.input.focus();
})();
</script>
</body>
</html>
